server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Use Docker's embedded DNS and force runtime resolution so
        # nginx doesn't fail if the backend DNS isn't available at startup.
        resolver 127.0.0.11 valid=30s;
        set $backend_upstream backend:5000;
        proxy_pass http://$backend_upstream;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
